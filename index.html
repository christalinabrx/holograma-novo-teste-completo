<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holograma 3D - Um Sujeito e Seus Eus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="hologram-bg">

    <div id="loadingScreen">
        <div class="text-center">
            <div class="spinner-border text-primary"></div>
            <h4 class="mt-3">Inicializando IA...</h4>
            <div class="progress mt-3" style="width: 300px;">
                <div id="loadingProgress" class="progress-bar" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- Widget ∞ flutuante (só aparece no modo carrossel) -->
    <div id="infinityWidget">
        <span class="inf-symbol">∞</span>
        <div class="inf-labels">
            <span class="inf-out">—</span>
            <span class="inf-in">—</span>
        </div>
    </div>

    <div class="hologram-grid" id="hologramGrid">
        <div class="hologram-face top-face">
            <video id="videoTop" autoplay playsinline muted></video>
            <div class="face-label" id="labelTop"></div>
        </div>

        <div class="hologram-face left-face">
            <video id="videoLeft" autoplay playsinline muted></video>
            <div class="face-label" id="labelLeft"></div>
        </div>

        <div class="main-controls">
            <div class="control-card">
                <h6 class="text-primary"><i class="fas fa-cube"></i> Holograma 3D</h6>
                <div id="systemStatus" class="small mb-2">Carregando...</div>

                <select id="cameraSelect" class="form-control form-control-sm mb-2" disabled>
                    <option>Buscando câmeras...</option>
                </select>

                <button id="startBtn" class="btn btn-primary btn-block btn-sm" disabled>
                    <i class="fas fa-play"></i> INICIAR
                </button>

                <!-- Painel IA (padrão) -->
                <div id="aiPanel" class="mt-3">
                    <small id="expressionName" class="font-weight-bold">NEUTRO</small>
                    <div class="progress" style="height: 6px; background: #222;">
                        <div id="confidenceFill" class="progress-bar bg-success" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Painel Carrossel -->
                <div id="carouselPanel" class="hidden">
                    <div class="carousel-face-list">
                        <div class="carousel-face-item">
                            <span class="face-name">▲ CIMA</span>
                            <span id="labelTopPanel">—</span>
                        </div>
                        <div class="carousel-face-item">
                            <span class="face-name">◄ ESQUERDA</span>
                            <span id="labelLeftPanel">—</span>
                        </div>
                        <div class="carousel-face-item">
                            <span class="face-name">► DIREITA</span>
                            <span id="labelRightPanel">—</span>
                        </div>
                        <div class="carousel-face-item">
                            <span class="face-name">▼ BAIXO</span>
                            <span id="labelBottomPanel">—</span>
                        </div>
                    </div>
                </div>

                <!-- Botão landmarks -->
                <button id="landmarksToggleBtn" disabled>⬡ PONTOS FACIAIS</button>

                <!-- Botão carrossel -->
                <button id="carouselToggleBtn" disabled>∞ CARROSSEL</button>

                <!-- Dica de teclado -->
                <div id="keyboardHint" class="hidden">← → ↑ ↓ para rotacionar</div>
            </div>
        </div>

        <div class="hologram-face right-face">
            <video id="videoRight" autoplay playsinline muted></video>
            <div class="face-label" id="labelRight"></div>
        </div>

        <div class="hologram-face bottom-face">
            <video id="videoBottom" autoplay playsinline muted></video>
            <div class="face-label" id="labelBottom"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="js/main.js" type="module"></script>
</body>
</html>
